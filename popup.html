<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <div class="main-container">
        <header>
            <h1>Tiempo de Tareas</h1>
            <span class="icon-header">↗</span>
        </header>

        <div class="tabs-container">
            <button class="tab active" data-target="view-input">Input</button>
            <button class="tab" data-target="view-overview">Overview</button>
            <button id="copy-all-btn" class="btn-copy-tabs" title="Copiar todas las tareas">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button id="delete-all-btn" class="btn-delete-all" title="Eliminar TODAS las tareas">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
            
        </div>
        
        <div class="content-area">
            <div id="view-input" class="tab-content active">
                <div class="input-group">
                    <label for="type-input">Task Type</label>
                    <select id="type-input" class="custom-select">
                        <option value="UTest">UTest</option>
                        <option value="Company Client">Company Client</option>
                        <option value="A11y Team">A11y Team</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="cycle-input">Ciclo</label>
                    <input type="text" id="cycle-input" placeholder="p. ej., Sprint 42">
                </div>

                <div class="input-group">
                    <label for="task-input">Tareas</label>
                    <div style="position: relative;">
                        <input type="text" id="task-input" list="task-options" placeholder="Escribe o selecciona una tarea..." autocomplete="off">
                        <datalist id="task-options">
                            </datalist>
                    </div>
                </div>

                <div class="action-container">
                    <button id="add-task-btn" class="btn-add">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M5 12H19" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                
                <p id="success-msg">¡Tarea guardada en Overview!</p>
            </div>

            <div id="view-overview" class="tab-content">
                <div class="total-time-banner">
                    <span class="total-label">TIEMPO TOTAL: </span>
                    <span id="total-time-display" class="total-value">00:00:00</span>


                </div>
    
                <div id="empty-state" class="empty-state-box">
                    No hay tareas activas. Agrega una desde la pestaña "Input".
                </div>
                <ul id="task-list" class="task-list">
                    </ul>
                
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
