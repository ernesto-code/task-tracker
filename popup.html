<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <div class="main-container">
        <header>
            <h1>Tiempo de Tareas</h1>
            <span class="icon-header">↗</span>
        </header>

        <div class="tabs-container">
            <button class="tab active" data-target="view-input">Input</button>
            <button class="tab" data-target="view-overview">Overview</button>
        </div>
        
        <div class="content-area">
            <div id="view-input" class="tab-content active">
                <div class="input-group">
                    <label for="cycle-input">Ciclo</label>
                    <input type="text" id="cycle-input" placeholder="p. ej., Sprint 42">
                </div>

                <div class="input-group">
                    <label for="task-input">Tareas</label>
                    <div style="position: relative;">
                        <input type="text" id="task-input" placeholder="Escribe o selecciona..." autocomplete="off">
                        
                        <ul id="task-suggestions" class="suggestions-list"></ul>
                    </div>
                </div>

                <div class="action-container">
                    <button id="add-task-btn" class="btn-add">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M5 12H19" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                
                <p id="success-msg">¡Tarea guardada en Overview!</p>
            </div>

            <div id="view-overview" class="tab-content">
                <ul id="task-list" class="task-list">
                    </ul>
                <div id="empty-state">
                    No hay tareas activas. Agrega una desde la pestaña "Input".
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
